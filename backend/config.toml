# Settings for the backend component.

[ingest]
# New uploads are refused when this many images wait for the worker.
# A slow device (the Raspberry Pi) cannot clear a long queue.
max_pending = 500

[api]
# Name of the environment variable that holds the access token.
# If this variable is set, every upload request needs the header
# "Authorization: Bearer <token>". If it is not set, the endpoint is open.
token_env_var = "SAARTHI_API_TOKEN"

[worker]
# How long the worker waits for a wake-up signal when no image waits, in seconds.
# An upload wakes the worker at once. This time is only a safety net.
idle_wait_seconds = 5
# The generic pass ("an object") runs on every Nth analysed image. 0 never runs it.
# Each generic pass costs one more detector run.
generic_pass_every = 10
# An image is a near duplicate if it looks like an image captured in this time window, in minutes.
duplicate_window_minutes = 60
# The worker compares with at most this number of recent images.
duplicate_max_compared = 200
# The worker waits this long after an error in its own loop, in seconds.
error_pause_seconds = 5

[server]
# The address and the port of the web server. It serves the upload page and the upload route.
# "0.0.0.0" accepts requests from the local network. "127.0.0.1" accepts only this computer.
host = "0.0.0.0"
port = 8080
# At shutdown, the server waits this long (in seconds) for the worker to finish its image.
worker_stop_seconds = 120

[maintenance]
# The maintenance job runs when the application starts, and then every N minutes.
# It deletes expired images (see retention.days in storage/config.toml), deletes orphan
# files, reports missing files, and saves the vector index to disk.
interval_minutes = 60
# At most this number of orphan files is deleted in one run. A larger number is reported
# as a warning and not deleted. This protects the images if the database is wrong or empty.
# 0 never deletes an orphan file.
orphan_delete_limit = 100
# Expired images are deleted in groups of this size.
retention_batch = 100

[enrollment]
# The largest number of reference photos for one object, and of objects.
max_photos_per_object = 20
max_objects = 50
