# Settings for the db component.
# All paths are relative to the db/ folder. Absolute paths and ".." are not allowed.

[paths]
sqlite = "data/saarthi.db"
faiss_index = "data/regions.faiss"
# The vectors of the open search (boxes of the broad detector) are in a second index.
open_faiss_index = "data/open_regions.faiss"

[vectors]
# Length of one embedding vector. It must match the embedding model.
dimension = 384
# The index is written to disk after this many added or removed vectors,
# and when the application stops. A crash can lose at most this many
# vectors. The start-up recovery repairs the loss.
checkpoint_every = 200
# Length of one vector of the open search. It must match the scene model (SigLIP base: 768).
open_dimension = 768
