[project]
name = "Saarthi"
version = "0.1.0"
description = "Edge Efficient Episodic Memory Aid"
readme = "README.md"
requires-python = "==3.11.15"
dependencies = [
    "black==26.5.1",
    "faiss-cpu==1.15.1",
    "fastapi==0.162.0",
    "nicegui==3.15.0",
    "numpy==2.4.6",
    "peewee==4.3.0",
    "pillow==12.3.0",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "transformers==5.14.1",
    "ultralytics==8.4.208",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest>=9.1.1",
]

# On Linux (x86 and the Raspberry Pi, aarch64) use the CPU-only torch wheel from the PyTorch CPU index.
# The wheel of PyPI for Linux needs the CUDA libraries (several GB), and neither machine has a GPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
# Tests that load the real models are slow. Run them with: pytest -m slow
markers = ["slow: loads the real models and may download them"]
addopts = "-m 'not slow'"
